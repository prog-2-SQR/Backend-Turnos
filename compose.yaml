services:
  postgres:
    image: postgres:18-alpine
    container_name: turnos-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-turnos}
      POSTGRES_USER: ${DB_USERNAME:-turnos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - turnos-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turnos-db-data:
