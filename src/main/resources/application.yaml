server:
  # 8081 para poder correr junto al servicio de catálogo (8080).
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: turnos
  config:
    # Lee el archivo .env de la raíz del proyecto si existe (en local).
    # En otros entornos las mismas claves llegan como variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:turnos}
    username: ${DB_USERNAME:turnos}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Liquibase; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    # Kafka de la cátedra (anexo §15). Datos de la integración en .env.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Grupo propio de Turnos: el catálogo usa KAFKA_CONSUMER_GROUP_ID para su topic, y si compartieran el grupo
      # los dos servicios se rebalancearían entre sí.
      group-id: ${KAFKA_CONSUMER_GROUP_ID:alumnos}-turnos
      # La primera vez lee el topic desde el principio; después sigue desde el último offset confirmado.
      auto-offset-reset: earliest
    listener:
      # El offset de cada mensaje se confirma cuando el listener terminó de procesarlo.
      ack-mode: record
  mvc:
    problemdetails:
      # Los errores HTTP salen como application/problem+json (RFC 9457), como pide el anexo §13.
      enabled: true

catedra:
  # Servicio central de la cátedra (anexo §3): ocupaciones y, más adelante, holds. Valores reales en .env.
  # Sin valor por defecto: si faltan, la validación de CatedraProperties frena el arranque.
  api-url: ${CATEDRA_API_URL:}
  jwt: ${CATEDRA_JWT:}
  # Topic de acciones de reserva (anexo §15.2): pedidos de teléfono y resultados. Sin valor por defecto: si falta,
  # la app no arranca.
  appointment-actions-topic: ${KAFKA_APPOINTMENT_ACTIONS_TOPIC}

catalogo:
  # Servicio de catálogo del proyecto (Documentacion/contratos/turnos-catalogo.md): profesionales y horarios.
  api-url: ${CATALOGO_API_URL:http://localhost:8080}

turnos:
  # Zona de las horas de atención (anexo §4: horas locales). Define qué turnos de hoy ya empezaron.
  time-zone: ${TURNOS_TIME_ZONE:America/Argentina/Buenos_Aires}

security:
  jwt:
    # Secreto propio para firmar los JWT de los usuarios de la app (HS512, mínimo 64 bytes en Base64).
    # Sin valor por defecto: si falta, la app no arranca. Nunca se commitea.
    base64-secret: ${JWT_BASE64_SECRET:}

management:
  endpoint:
    health:
      # Muestra el estado de cada componente (db, disco...) sin exponer detalles internos.
      show-components: always
