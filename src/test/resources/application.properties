# Valores falsos para todos los tests (se suman al application.yaml). No son datos reales.
# Los tests que llaman a la cátedra o al catálogo los reemplazan por la URL de su WireMock.
catedra.api-url=http://localhost:8090
catedra.jwt=jwt-de-prueba
catalogo.api-url=http://localhost:8080
# Kafka: el listener no arranca en los tests (no hay broker); el test de Kafka lo prende con su contenedor.
spring.kafka.listener.auto-startup=false
catedra.appointment-actions-topic=alumnos.turnos.acciones.test
