name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Los CI de una misma rama corren de a uno y en orden: así el último commit es también el último que analiza
# SonarQube Cloud (con merges seguidos, un análisis viejo podía llegar después y pisar al nuevo).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          # Historia completa: SonarQube Cloud la usa para saber qué código es nuevo en cada PR.
          fetch-depth: 0

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

      # Usa lo compilado y el reporte de cobertura del paso anterior. El resultado (quality gate, bugs,
      # vulnerabilidades, duplicación, cobertura) aparece en el PR y en sonarcloud.io.
      - name: Analizar con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar
